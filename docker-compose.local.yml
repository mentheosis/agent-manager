services:
  agent-manager:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        BASE_IMAGE: agent-manager:base
    image: agent-manager:local

    # Linux: make host.docker.internal resolve to the host gateway IP.
    # (Docker Desktop on macOS/Windows provides this automatically.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Pass the docker-mcp bearer token and URL into the container so
      # Claude Code (and the Agent SDK) can reach the host-side MCP server.
      DOCKER_MCP_URL: "http://host.docker.internal:9090"
      DOCKER_MCP_TOKEN: "${DOCKER_MCP_TOKEN}"

    # Bind-mount host checkouts at the exact paths recorded in the instances'
    # metadata (path + add_dirs). Workdirs must live on mounts, not the
    # container writable layer, or `compose down` destroys them. Both
    # /app/agent_manager and /app/agent-manager are referenced by instances;
    # they share the same host repo.
    volumes:
      - ${HOME}/wrk/agent_manager:/app/agent_manager
      - ${HOME}/wrk/agent_manager:/app/agent-manager
      - ${HOME}/wrk/claude-squad:/app/claude-squad
      - ${HOME}/wrk/CUSTODY/custody:/app/custody
      - ${HOME}/wrk/CUSTODY/custody-local-dev:/app/custody-local-dev
      - ${HOME}/wrk/CUSTODY/insto-custody-backend:/app/insto-custody-backend
      - ${HOME}/wrk/CUSTODY/custody-gateway-rs:/app/custody-gateway-rs
      - ${HOME}/wrk/CUSTODY/fx_www:/app/fx_www
      - ${HOME}/wrk/CUSTODY/kvhub:/app/kvhub
      - ${HOME}/wrk/CUSTODY/funding-rs:/app/funding-rs
      - ${HOME}/wrk/CUSTODY/portfolio:/app/portfolio
      - ${HOME}/wrk/CUSTODY/kweb:/app/kweb
      - ${HOME}/wrk/CUSTODY/kids:/app/kids
      - ${HOME}/wrk/CUSTODY/kdba-migrations-v2:/app/kdba-migrations-v2
